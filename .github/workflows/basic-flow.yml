name: Java Spring Boot CI

# 1. Quy định khi nào pipeline sẽ chạy
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    # Môi trường máy ảo chạy CI
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo mã nguồn từ repository về máy ảo
      - name: Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Bước 3: Cấp quyền thực thi cho Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Bước 4: Thiết lập Gradle & Cache để các lần chạy sau nhanh hơn
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Bước 5: Chạy Unit Test
      - name: Run Unit Tests
        run: ./gradlew test

      # Bước 6: Đóng gói ứng dụng thành file .jar (bỏ qua test vì đã chạy ở bước trên)
      - name: Build & Package with Gradle
        run: ./gradlew bootJar -x test

      # Bước 7: Upload file .jar lên GitHub để tải về (Artifacts)
      - name: Upload built JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: build/libs/*.jar
          retention-days: 7 # Tự động xóa file sau 7 ngày để tiết kiệm dung lượng
